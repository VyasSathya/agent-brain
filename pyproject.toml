[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-brain"
version = "0.1.0"
description = "One shared, source-linked memory for coding agents: routing, current handoffs, and completed/remaining/validated kept apart."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Vyas Sathya"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["claude-code", "codex", "agents", "memory", "handoff", "llm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
]

[project.scripts]
agent-brain = "agent_brain.continuity:run"

[tool.setuptools]
packages = ["agent_brain"]
